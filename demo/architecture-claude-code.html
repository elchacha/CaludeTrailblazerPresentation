<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --blue: #58a6ff;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: var(--blue); letter-spacing: 0.5px; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .diagram-wrap { width: 100%; max-width: 1080px; }
  svg { width: 100%; height: auto; }

  .node { cursor: pointer; }
  .node:hover rect, .node:hover .box-bg { opacity: 0.9; }
  .node.active rect, .node.active .box-bg { filter: brightness(1.25); }

  .info-panel {
    margin-top: 18px;
    width: 100%;
    max-width: 1080px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    min-height: 80px;
  }
  .info-placeholder { color: var(--text-muted); font-size: 13px; font-style: italic; }
  .info-title { font-size: 15px; font-weight: 600; color: var(--blue); margin-bottom: 6px; }
  .info-body { font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
  .info-example {
    font-size: 12px;
    color: var(--text-muted);
    font-family: monospace;
    background: var(--surface2);
    border-radius: 4px;
    padding: 8px 12px;
    border-left: 3px solid var(--border);
    white-space: pre;
    line-height: 1.5;
  }
</style>
</head>

<script>
const INFO = {
  claudemd: {
    title: '📄 CLAUDE.md — Instructions projet persistantes',
    body: 'Fichier markdown lu par le CLI au démarrage. Son contenu est injecté verbatim dans le system prompt à chaque conversation. Sert à donner des instructions durables : architecture du projet, commandes à connaître, conventions, règles métier. Peut être placé à la racine et dans les sous-dossiers (les deux sont fusionnés).',
    example: '# CLAUDE.md\n## Stack\n- Backend Java 21, Spring Boot 3\n- Frontend React 18, Vite\n## Commandes\n- Build : mvn clean package\n- Tests : mvn test -pl backend\n\n→ Injecté automatiquement dans le contexte à chaque session\n→ Remplace les instructions répétées manuellement'
  },
  memory: {
    title: '🧠 memory/ — Mémoire persistante inter-sessions',
    body: 'Fichiers markdown dans ~/.claude/projects/<projet>/memory/. Le CLI lit MEMORY.md (index) et charge les fichiers pertinents dans le contexte. Contrairement à CLAUDE.md (instructions stables), memory stocke des informations évolutives : profil utilisateur, feedbacks reçus, contexte projet du moment.',
    example: 'Types de mémoire :\n• user      → profil, rôle, niveau technique\n• feedback  → corrections et validations reçues\n• project   → contexte, décisions, deadlines\n• reference → où trouver quoi (Linear, Grafana…)\n\n→ Écrits/lus via les tools Write/Read comme n\'importe quel fichier'
  },
  skills: {
    title: '⚡ Skills — Compétences invocables avec /slash',
    body: 'Fichiers markdown qui définissent un workflow. Quand tu tapes /marp-build, le CLI charge le fichier skill correspondant et injecte ses instructions dans le contexte : le LLM les lit comme une procédure à suivre. Permet d\'encapsuler des workflows complexes et de les réutiliser sans les retaper.',
    example: '# skill: marp-build\nRun these steps:\n1. npx @marp-team/marp-cli slides.md --html --theme-set theme.css -o slides.html\n2. node inject-jokes.mjs\n3. Report success with slide count\n\n→ Déclenché par /marp-build\n→ Définis dans ~/.claude/skills/ ou .claude/skills/'
  },
  settings: {
    title: '⚙️ settings.json — Configuration du comportement du CLI',
    body: 'Fichier JSON de configuration du CLI (.claude/settings.json ou ~/.claude/settings.json). Contrôle trois choses : les permissions (quels tools sont auto-approuvés), les hooks (scripts shell déclenchés sur des events), et les serveurs MCP (quels processus démarrer). Hiérarchie : global → projet → local.',
    example: '{\n  "permissions": {\n    "allow": ["Bash(npm:*)", "Bash(python:*)"]\n  },\n  "hooks": {\n    "PostToolUse": [{\n      "matcher": "Edit",\n      "hooks": [{ "type": "command", "command": "python rebuild.py" }]\n    }]\n  },\n  "mcpServers": {\n    "gmail": { "command": "npx", "args": ["@gmail-mcp/server"] }\n  }\n}'
  },
  cli: {
    title: '⚙️ CLI Node.js — L\'orchestrateur local (le cœur de Claude Code)',
    body: 'Application Node.js qui tourne sur ta machine. Au démarrage : lit settings.json, charge CLAUDE.md + memory, démarre les MCP servers. Ensuite il boucle : assemble contexte → envoie à l\'API → reçoit réponse → si tool_use : exécute localement → renvoie tool_result → recommence. S\'arrête quand le LLM génère une réponse texte pure.',
    example: 'Boucle CLI :\n1. Assemble contexte → POST /v1/messages\n2. Réponse = { type: "tool_use", name: "Read", input: { file_path: "/src/foo.js" } }\n3. CLI exécute  fs.readFileSync("/src/foo.js")  localement\n4. Renvoie  { type: "tool_result", content: "..." }  → retour étape 1\n5. Quand réponse = texte pur → affiche à l\'utilisateur, attend la prochaine saisie'
  },
  context: {
    title: '📦 Contexte — Ce que le LLM "voit" à chaque appel API',
    body: 'Le contexte est le payload JSON envoyé à l\'API à chaque tour. Il contient : le system prompt (CLAUDE.md + memory + skills actifs), les définitions JSON Schema des tools disponibles, et l\'historique complet de la conversation (messages user, réponses LLM, tool_use blocks, tool_results). Limité à ~200k tokens.',
    example: 'Token budget approximatif :\n• CLAUDE.md              :   6 000 tokens\n• memory/                :   4 000 tokens\n• tools definitions      :   5 000 tokens\n• Historique (croît)     : +2 000 tokens / tour\n──────────────────────────────────────────────\n→ /compact  : résume l\'historique → libère de l\'espace\n→ /clear    : repart de zéro (garde le system prompt)'
  },
  llm: {
    title: '🧠 LLM Claude — Le modèle de langage (cloud Anthropic)',
    body: 'Tourne dans le cloud Anthropic. Ne touche jamais directement le disque, le réseau, ni les fichiers locaux — tout passe par le CLI. Reçoit le contexte assemblé et génère soit un bloc tool_use (JSON précisant quel tool appeler avec quels args), soit une réponse texte finale.',
    example: 'Exemple de réponse LLM avec tool_use :\n{\n  "type": "tool_use",\n  "id": "toolu_01Xabc",\n  "name": "Edit",\n  "input": {\n    "file_path": "/src/main.py",\n    "old_string": "def foo():",\n    "new_string": "def bar():"\n  }\n}\n→ Le CLI intercepte ce JSON et exécute l\'édition localement\n→ Le LLM ne sait pas ce que font les tools, seulement leur description'
  },
  files: {

function showInfo(key) {
  const d = INFO[key];
  if (!d) return;
  document.getElementById('info-placeholder').style.display = 'none';
  const content = document.getElementById('info-content');
  content.style.display = 'block';
  document.getElementById('info-title').textContent   = d.title;
  document.getElementById('info-body').textContent    = d.body;
  document.getElementById('info-example').textContent = d.example;
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  const node = document.getElementById('node-' + key);
  if (node) node.classList.add('active');
}
</script>

<script>
function setTheme(theme) { /* diagram uses inline dark theme */ }
window.addEventListener('message', (e) => { if (e.data && e.data.theme) setTheme(e.data.theme); });
document.addEventListener('DOMContentLoaded', () => {
  try {
    const isProjector = window.parent.sessionStorage.getItem('projectorMode') === 'true';
    setTheme(isProjector ? 'projector' : 'normal');
  } catch(e) {}
});
</script>
