<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code — Architecture animée</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --blue: #58a6ff;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 24px 0;
    overflow: hidden;
    user-select: none;
  }
  h1 { text-align: center; font-size: 20px; color: var(--blue); margin-bottom: 2px; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 10px; }
  .kbd {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 11px;
    font-family: monospace;
  }

  .diagram-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    min-height: 0;
  }
  svg {
    max-width: 100%;
    max-height: calc(100vh - 155px);
    height: auto;
    display: block;
  }

  .anim {
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .anim.visible { opacity: 1; }

  /* Step description */
  .step-desc {
    text-align: center;
    font-size: 13px;
    color: var(--text);
    min-height: 18px;
    padding: 4px 40px 6px;
    flex-shrink: 0;
    transition: opacity 0.3s;
  }

  /* Controls bar */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px 0 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover:not(:disabled) { background: #2d333b; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #388bfd; }

  .step-counter {
    font-size: 13px;
    color: var(--text-muted);
    min-width: 54px;
    text-align: center;
  }

  .step-dots {
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.25s, transform 0.2s;
  }
  .dot:hover { transform: scale(1.3); }
  .dot.done   { background: #238636; }
  .dot.active { background: var(--blue); transform: scale(1.25); }
</style>
</head>
<body>

<h1>🏗️ Architecture Claude Code</h1>
<p class="subtitle">Clic · <span class="kbd">Space</span> · <span class="kbd">→</span> avancer &nbsp;|&nbsp; <span class="kbd">←</span> reculer &nbsp;|&nbsp; points cliquables pour sauter</p>

<p class="step-desc" id="step-desc"> </p>

<div class="controls" id="controls">
  <button class="btn" id="btn-prev" onclick="prev()" disabled>◀ Précédent</button>
  <div class="step-dots" id="dots"></div>
  <span class="step-counter" id="step-counter">0 / 9</span>
  <button class="btn primary" id="btn-next" onclick="next()">Démarrer ▶</button>
</div>

<script>
const TOTAL = 9;

const STEP_GROUPS = [
  [],
  ['grp-zone-local', 'grp-zone-cloud', 'grp-llm'],
  ['grp-claudemd', 'grp-memory', 'grp-skills'],
  ['grp-settings'],
  ['grp-arr-sources', 'grp-cli'],
  ['grp-arr-ctx', 'grp-context'],
  ['grp-arr-send'],
  ['grp-arr-recv'],
  ['grp-arr-tools', 'grp-files', 'grp-agents', 'grp-mcp'],
  ['grp-legend'],
];

const STEP_DESC = [
  '',
  'Le LLM Claude tourne dans le cloud Anthropic — il ne touche jamais directement le disque ni le réseau.',
  'Au démarrage, le CLI lit les sources : CLAUDE.md (instructions projet), memory/ (persistance inter-sessions), et skills/ si invoqués.',
  'settings.json configure le CLI : permissions auto-approuvées, hooks déclenchés sur des événements, MCP servers à démarrer.',
  'Les sources sont injectées dans le contexte. settings.json configure le comportement du CLI (sans être injecté dans le contexte LLM).',
  'Le CLI assemble le contexte complet : system prompt + définitions JSON Schema des tools + historique de la conversation.',
  'Le contexte est envoyé au LLM via l\'API Anthropic en HTTPS. C\'est le seul moment où les données quittent la machine.',
  'Le LLM renvoie sa réponse au CLI : un bloc tool_use (JSON) ou une réponse texte finale. Le LLM ne sait pas exécuter les tools lui-même.',
  'Si tool_use, le CLI exécute localement — fichiers, agents sous-tâches, MCP servers. Le résultat rentre dans le contexte et la boucle recommence.',
  'Vue d\'ensemble complète. La boucle CLI → API → tool_use → exécution → tool_result → API tourne jusqu\'à la réponse finale.',
];

let current = 0;

// Build dots
const dotsEl = document.getElementById('dots');
for (let i = 1; i <= TOTAL; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  d.id = 'dot-' + i;
  d.title = 'Étape ' + i;
  d.addEventListener('click', (e) => { e.stopPropagation(); goTo(i); });
  dotsEl.appendChild(d);
}

function render() {
  // Reveal all groups up to current step
  document.querySelectorAll('.anim').forEach(el => el.classList.remove('visible'));
  for (let s = 1; s <= current; s++) {
    STEP_GROUPS[s].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('visible');
    });
  }

  // Dots
  for (let i = 1; i <= TOTAL; i++) {
    const d = document.getElementById('dot-' + i);
    d.className = 'dot' + (i < current ? ' done' : i === current ? ' active' : '');
  }

  // Counter
  document.getElementById('step-counter').textContent = current + ' / ' + TOTAL;

  // Description (fade trick)
  const descEl = document.getElementById('step-desc');
  descEl.style.opacity = '0';
  setTimeout(() => {
    descEl.textContent = STEP_DESC[current] || ' ';
    descEl.style.opacity = '1';
  }, 150);

  // Buttons
  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === TOTAL;
  if (current === 0)     nextBtn.textContent = 'Démarrer ▶';
  else if (current === TOTAL) nextBtn.textContent = '✓ Terminé';
  else                   nextBtn.textContent = 'Suivant ▶';
}

function next()  { if (current < TOTAL) { current++; render(); } }
function prev()  { if (current > 0)     { current--; render(); } }
function goTo(s) { current = s; render(); }

// Click on diagram = next
document.getElementById('diagram-wrap').addEventListener('click', next);
// Prevent controls clicks from bubbling to diagram-wrap
document.getElementById('controls').addEventListener('click', (e) => e.stopPropagation());

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); prev(); }
});

render();
</script>

<script>
window.addEventListener('message', (e) => { /* inline dark theme, no swap needed */ });
document.addEventListener('DOMContentLoaded', () => {
  try { window.parent.sessionStorage.getItem('projectorMode'); } catch(e) {}
});
</script>
</body>
</html>
